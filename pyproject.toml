[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sumosearch"
version = "0.3.0"
description = "Sumo Logic search log fetcher CLI"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
sumosearch = "sumosearch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sumosearch"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
